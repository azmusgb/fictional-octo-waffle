<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbench Studio v5</title><script>(async()=>{const n=13,p=[];for(let i=0;i<n;i++){const r=await fetch(`/c${String(i).padStart(2,"0")}.txt`);if(!r.ok)throw new Error(`chunk ${i} returned ${r.status}`);p.push(await r.text())}const a=Uint8Array.from(atob(p.join("")),c=>c.charCodeAt(0)),s=new Blob([a]).stream().pipeThrough(new DecompressionStream("gzip")),h=await new Response(s).text();document.open();document.write(h);document.close()})().catch(e=>document.body.innerHTML=`<pre>Unable to load Workbench Studio v5: ${e.message}</pre>`)</script>
