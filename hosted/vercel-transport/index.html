<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Workbench Studio v8.2</title><style>html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1220;color:#e8eef8}body{display:grid;place-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.loader{width:min(460px,calc(100% - 40px));padding:28px;border:1px solid #263650;border-radius:18px;background:#121c2e;box-shadow:0 24px 70px rgba(0,0,0,.35)}h1{font-size:20px;margin:0 0 10px}p{margin:0;color:#aebbd0;line-height:1.5}.bar{height:4px;margin-top:20px;border-radius:99px;overflow:hidden;background:#24324a}.bar:after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:#5b8cff;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(125%)}}pre{white-space:pre-wrap;color:#ffb4b4}</style></head><body><main class="loader"><h1>Workbench Studio v8.2</h1><p>Loading the verified personalized mobile command workspace…</p><div class="bar" aria-hidden="true"></div></main><script>(async()=>{const source='https://raw.githubusercontent.com/azmusgb/fictional-octo-waffle/main/hosted/index.html';const response=await fetch(source,{cache:'no-store'});if(!response.ok)throw new Error(`Application source returned HTTP ${response.status}`);const html=await response.text();if(!html.includes('Workbench Studio v8.2'))throw new Error('Application source validation failed');document.open();document.write(html);document.close()})().catch(error=>{document.body.innerHTML=`<main class="loader"><h1>Workbench Studio v8.2 could not load</h1><pre>${String(error&
