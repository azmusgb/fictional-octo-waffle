name: Materialize Workbench Studio v8 source

on:
  push:
    branches:
      - workbench-studio-v8
    paths:
      - '.github/workflows/materialize-workbench-v8.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify source archive
        shell: bash
        run: |
          curl --fail --location --retry 3 --output /tmp/WorkbenchStudio-v8.zip 'https://at.adobe.com/1McVYsSxZAvi7wk4'
          echo "3d04bfe5009a3104a3ae4d5e4d23c4cdc04bf393f428cac6a0a522a15a3a4f64  /tmp/WorkbenchStudio-v8.zip" | sha256sum --check --strict
          unzip -q /tmp/WorkbenchStudio-v8.zip -d /tmp/workbench-source
          test -f /tmp/workbench-source/WorkbenchStudio-v8/README.md
          test -f /tmp/workbench-source/WorkbenchStudio-v8/WorkbenchStudio.sln
          test -f /tmp/workbench-source/WorkbenchStudio-v8/client/src/components/CommandIntelligenceCenter.tsx
          test -f /tmp/workbench-source/WorkbenchStudio-v8/server/WorkbenchStudio.Api/Services/CommandIntelligenceService.cs
          test -f /tmp/workbench-source/WorkbenchStudio-v8/hosted/index.html

      - name: Materialize repository tree
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' /tmp/workbench-source/WorkbenchStudio-v8/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Workbench Studio v8 Command Intelligence"
          git push origin HEAD:workbench-studio-v8
