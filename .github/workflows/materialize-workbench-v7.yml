name: Materialize Workbench Studio v7 source

on:
  push:
    branches:
      - workbench-studio-v7
    paths:
      - '.github/workflows/materialize-workbench-v7.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify source archive
        shell: bash
        run: |
          curl --fail --location --retry 3 --output /tmp/WorkbenchStudio-v7.zip 'https://at.adobe.com/F4VcGh6ACOdDZNZp'
          echo "fa61facd79681eccaa866c017d667dd52071e7a773b701c3b90bbeb0075707c0  /tmp/WorkbenchStudio-v7.zip" | sha256sum --check --strict
          unzip -q /tmp/WorkbenchStudio-v7.zip -d /tmp/workbench-source
          test -f /tmp/workbench-source/WorkbenchStudio-v7/README.md
          test -f /tmp/workbench-source/WorkbenchStudio-v7/WorkbenchStudio.sln
          test -f /tmp/workbench-source/WorkbenchStudio-v7/client/src/components/DecisionCenter.tsx
          test -f /tmp/workbench-source/WorkbenchStudio-v7/server/WorkbenchStudio.Api/Endpoints/DecisionEndpoints.cs
          test -f /tmp/workbench-source/WorkbenchStudio-v7/hosted/index.html

      - name: Materialize repository tree
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' /tmp/workbench-source/WorkbenchStudio-v7/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Evolve Workbench Studio to v7 Decision Operations"
          git push origin HEAD:workbench-studio-v7
