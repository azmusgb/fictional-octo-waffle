name: Materialize Workbench Studio v5 source

on:
  push:
    branches:
      - workbench-studio-v5-source
    paths:
      - 'repo-payload/**'
      - '.github/workflows/materialize-workbench-v5.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check source payload
        id: payload
        shell: bash
        run: |
          required=(part00.b64 part01.b64 part02.b64 tail00.b64 tail01.b64 tail02.b64 tail03.b64 tail04.b64 tail05.b64 tail06.b64)
          missing=0
          for file in "${required[@]}"; do
            if [ ! -f "repo-payload/$file" ]; then
              echo "Missing repo-payload/$file"
              missing=$((missing + 1))
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Reconstruct and verify source archive
        if: steps.payload.outputs.missing == '0'
        shell: bash
        run: |
          cat \
            repo-payload/part00.b64 \
            repo-payload/part01.b64 \
            repo-payload/part02.b64 \
            repo-payload/tail00.b64 \
            repo-payload/tail01.b64 \
            repo-payload/tail02.b64 \
            repo-payload/tail03.b64 \
            repo-payload/tail04.b64 \
            repo-payload/tail05.b64 \
            repo-payload/tail06.b64 \
            | base64 --decode > /tmp/WorkbenchStudio-v5.zip
          echo "5836788f1ee39dfe3dc67d978e916bdc34f38e979707961b205b933b7d78d630  /tmp/WorkbenchStudio-v5.zip" | sha256sum --check --strict
          unzip -q /tmp/WorkbenchStudio-v5.zip -d /tmp/workbench-source
          test -f /tmp/workbench-source/WorkbenchStudio-v5/README.md
          test -f /tmp/workbench-source/WorkbenchStudio-v5/WorkbenchStudio.sln
          test -f /tmp/workbench-source/WorkbenchStudio-v5/client/src/App.tsx
          test -f /tmp/workbench-source/WorkbenchStudio-v5/server/WorkbenchStudio.Api/Program.cs

      - name: Materialize repository tree
        if: steps.payload.outputs.missing == '0'
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' /tmp/workbench-source/WorkbenchStudio-v5/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete Workbench Studio v5 source"
          git push origin HEAD:workbench-studio-v5-source
