name: Materialize Workbench Studio v5 source

on:
  push:
    branches:
      - workbench-studio-v5-source
    paths:
      - '.github/workflows/materialize-workbench-v5.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify source archive
        shell: bash
        run: |
          curl --fail --location --retry 3 --output /tmp/WorkbenchStudio-v5.zip 'https://at.adobe.com/YAezN35ioWTKLJdZ'
          echo "5836788f1ee39dfe3dc67d978e916bdc34f38e979707961b205b933b7d78d630  /tmp/WorkbenchStudio-v5.zip" | sha256sum --check --strict
          unzip -q /tmp/WorkbenchStudio-v5.zip -d /tmp/workbench-source
          test -f /tmp/workbench-source/WorkbenchStudio-v5/README.md
          test -f /tmp/workbench-source/WorkbenchStudio-v5/WorkbenchStudio.sln
          test -f /tmp/workbench-source/WorkbenchStudio-v5/client/src/App.tsx
          test -f /tmp/workbench-source/WorkbenchStudio-v5/server/WorkbenchStudio.Api/Program.cs

      - name: Materialize repository tree
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' /tmp/workbench-source/WorkbenchStudio-v5/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete Workbench Studio v5 source"
          git push origin HEAD:workbench-studio-v5-source
