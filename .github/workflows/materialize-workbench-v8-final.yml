name: Materialize final Workbench Studio v8 release

on:
  push:
    branches:
      - release-v8-final
    paths:
      - '.github/workflows/materialize-workbench-v8-final.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify final release archive
        shell: bash
        run: |
          curl --fail --location --retry 3 --output /tmp/WorkbenchStudio-v8.zip 'https://at.adobe.com/z9PLBT0JFqsBRJ9C'
          echo "6c38672d77d964489aa08cbd6132bf905f073f311782869f65fae5a3fda810c1  /tmp/WorkbenchStudio-v8.zip" | sha256sum --check --strict
          unzip -q /tmp/WorkbenchStudio-v8.zip -d /tmp/workbench-source
          test -f /tmp/workbench-source/WorkbenchStudio-v8/README.md
          test -f /tmp/workbench-source/WorkbenchStudio-v8/DEPLOYMENT.md
          test -f /tmp/workbench-source/WorkbenchStudio-v8/client/src/components/CommandIntelligenceCenter.tsx
          test -f /tmp/workbench-source/WorkbenchStudio-v8/server/WorkbenchStudio.Api/Services/CommandIntelligenceService.cs
          grep -q 'f9d63a0cb83a97537dd09171170f0b3986ffd980' /tmp/workbench-source/WorkbenchStudio-v8/hosted/vercel-transport/index.html

      - name: Materialize final repository tree
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' /tmp/workbench-source/WorkbenchStudio-v8/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync final Workbench Studio v8 release"
          git push origin HEAD:release-v8-final
