name: Materialize Workbench Studio v8.3

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench-studio-v8-3-portable
          fetch-depth: 0

      - name: Download and verify payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/v83.zip 'https://at.adobe.com/rN4jTT3uOlongPaB'
          echo 'b400262946266e05b2ecdfc9d884aeac8fd74aab0bfc1c6d1c519b82988aea3d  /tmp/v83.zip' | sha256sum -c -
          rm -rf .v83payload
          unzip -q /tmp/v83.zip -d .v83payload

      - name: Apply portable-workspace release
        shell: bash
        run: |
          set -euo pipefail
          python .v83payload/apply_v83.py

      - name: Validate hosted application
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('hosted/index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('No hosted script found')
          Path('/tmp/workbench-v83-hosted.js').write_text(scripts[-1])
          for symbol in ['Portable Workspace v8.3','createHostedProfile','parseHostedPackage','restoreHostedBackup','continuousCloudSync','workbench-studio-preferences']:
              if symbol not in html:
                  raise SystemExit(f'Missing hosted symbol: {symbol}')
          PY
          node --check /tmp/workbench-v83-hosted.js
          python -m json.tool package.json >/dev/null
          python -m json.tool client/package.json >/dev/null
          python -m json.tool hosted/vercel-transport/package.json >/dev/null
          grep -q 'version: 2' client/src/lib/userPreferences.ts
          grep -q 'checksum-protected' README.md

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v83payload
          rm -f .github/workflows/materialize-v83-portable.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Workbench Studio v8.3 portable workspace'
          git push origin HEAD:workbench-studio-v8-3-portable
