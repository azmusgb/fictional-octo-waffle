name: Package Workbench Studio v8.4 source

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out exact final main commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach d312b9d62fca20f7717a0fa15d0588e7f504dadb

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            server/WorkbenchStudio.Api/WorkbenchStudio.Api.csproj
            tests/WorkbenchStudio.Api.Tests/WorkbenchStudio.Api.Tests.csproj

      - name: Validate exact final source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix client --no-audit --no-fund
          npm --prefix client run build
          npm --prefix client run test
          dotnet restore WorkbenchStudio.sln
          dotnet build WorkbenchStudio.sln --configuration Release --no-restore
          dotnet test tests/WorkbenchStudio.Api.Tests/WorkbenchStudio.Api.Tests.csproj --configuration Release --no-build --no-restore
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, re
          html = Path('hosted/index.html').read_text()
          HTMLParser().feed(html)
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('No hosted script found')
          Path('/tmp/workbench-hosted.js').write_text(scripts[-1])
          for symbol in ['experience-hero','renderExperienceHero','Portable Workspace v8.4','v84-summary']:
              if symbol not in html:
                  raise SystemExit(f'Missing hosted symbol: {symbol}')
          for file in ['package.json','client/package.json','client/package-lock.json','hosted/vercel-transport/package.json']:
              json.loads(Path(file).read_text())
          PY
          node --check /tmp/workbench-hosted.js

      - name: Create verified source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=WorkbenchStudio-v8.4/ d312b9d62fca20f7717a0fa15d0588e7f504dadb -o WorkbenchStudio-v8.4.zip
          sha256sum WorkbenchStudio-v8.4.zip > WorkbenchStudio-v8.4.zip.sha256
          unzip -t WorkbenchStudio-v8.4.zip >/dev/null
          unzip -l WorkbenchStudio-v8.4.zip | grep -q 'WorkbenchStudio-v8.4/client/src/components/WorkspaceHero.tsx'
          unzip -l WorkbenchStudio-v8.4.zip | grep -q 'WorkbenchStudio-v8.4/.github/workflows/validate-workbench.yml'
          if unzip -l WorkbenchStudio-v8.4.zip | grep -q '\.tsbuildinfo'; then
            echo 'Archive contains generated TypeScript cache.' >&2
            exit 1
          fi
          if unzip -l WorkbenchStudio-v8.4.zip | grep -q 'package-v84-source.yml'; then
            echo 'Archive contains temporary packaging workflow.' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: workbench-studio-v8.4-source
          path: |
            WorkbenchStudio-v8.4.zip
            WorkbenchStudio-v8.4.zip.sha256
          if-no-files-found: error
          retention-days: 90
