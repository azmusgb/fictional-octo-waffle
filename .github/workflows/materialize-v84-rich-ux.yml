name: Materialize Workbench Studio v8.4 Rich UX

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench-studio-v8-4-rich-ux
          fetch-depth: 0

      - name: Download and verify payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/v84.zip 'https://at.adobe.com/Hm9bguHnYoiwP6Kf'
          echo '350a2013c252cf0944c1f0c0f414812e1adf3395fc0dc7a5e67c7f06d76b21ee  /tmp/v84.zip' | sha256sum -c -
          rm -rf .v84payload
          unzip -q /tmp/v84.zip -d .v84payload

      - name: Apply rich experience release
        shell: bash
        run: |
          set -euo pipefail
          python .v84payload/apply_v84.py

      - name: Validate hosted experience
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, re
          html = Path('hosted/index.html').read_text()
          HTMLParser().feed(html)
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('No hosted script found')
          Path('/tmp/workbench-v84-hosted.js').write_text(scripts[-1])
          for symbol in ['experience-hero','renderExperienceHero','Portable Workspace v8.4','v84-summary','workbench-preferences-v8.4.json']:
              if symbol not in html:
                  raise SystemExit(f'Missing hosted symbol: {symbol}')
          for file in ['package.json','client/package.json','hosted/vercel-transport/package.json']:
              json.loads(Path(file).read_text())
          PY
          node --check /tmp/workbench-v84-hosted.js

      - name: Build and test React client
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix client --no-audit --no-fund
          npm --prefix client run build
          npm --prefix client run test

      - name: Verify release boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'WorkspaceHero' client/src/App.tsx
          grep -q 'workspace-command-hero' client/src/styles/app.css
          grep -q "appVersion: '0.8.4'" client/src/lib/userPreferences.ts
          grep -q 'v8.4 rich-experience validation' VALIDATION.md
          test ! -e client/public/evidence-network.png
          test "$(grep -c '^client/src/components/WorkspaceHero.tsx$' PACKAGE_MANIFEST.txt)" -eq 1

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v84payload
          rm -f .github/workflows/materialize-v84-rich-ux.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish Workbench Studio with rich decision UX'
          git push origin HEAD:workbench-studio-v8-4-rich-ux
